# ==========================================
# 🚀 CONFIGURACIÓN DEL SERVIDOR
# ==========================================
# 🔔 WEB PUSH - VAPID KEYS
vapid.public.key=${VAPID_PUBLIC_KEY}
vapid.private.key=${VAPID_PRIVATE_KEY}
vapid.subject=mailto:admin@wheretosmoke.com
# Puerto 8081 (Para no chocar con tu web principal)
server.port=8081
spring.application.name=wheretosmoke

# ==========================================
# 🐬 CONEXIÓN A MYSQL
# ==========================================
# Asegúrate de crear la DB 'wheretosmoke_db' en tu MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/wheretosmoke_db?useSSL=false&serverTimezone=America/Bogota&allowPublicKeyRetrieval=true
spring.datasource.username=root
# Si tu MySQL no tiene contraseña (común en XAMPP), deja esto vacío. Si tiene, ponla aquí.
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==========================================
# 🛠️ HERRAMIENTAS DE DESARROLLO (JPA)   
# ==========================================
# Crea las tablas automáticamente al iniciar
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
# Muestra el SQL en consola 
spring.jpa.show-sql=${SHOW_SQL:false}
# ==========================================
# 🌍 FORMATO
# ==========================================
spring.jackson.time-zone=America/Bogota

azure.openai.endpoint=https://esteb-mdiel2ip-swedencentral.cognitiveservices.azure.com/openai/responses?api-version=2025-04-01-preview
azure.openai.api-key=${AZURE_OPENAI_API_KEY}
azure.openai.model=gpt-5.2-chat


# Secretos locales (archivo ignorado por git). En produccion usa variables de entorno.
spring.config.import=optional:file:./secrets.properties

# JWT (obligatorio, minimo 32 caracteres)
jwt.secret=${JWT_SECRET}

# CORS: origenes permitidos separados por coma
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173}
