# ==========================================
# 🚀 CONFIGURACIÓN DEL SERVIDOR
# ==========================================
# 🔔 WEB PUSH - VAPID KEYS
vapid.public.key=${VAPID_PUBLIC_KEY}
vapid.private.key=${VAPID_PRIVATE_KEY}
vapid.subject=mailto:admin@wheretosmoke.com
# Puerto 8081 (Para no chocar con tu web principal)
server.port=8081
spring.application.name=wheretosmoke

# ==========================================
# 🐬 CONEXIÓN A MYSQL
# ==========================================
# Asegúrate de crear la DB 'wheretosmoke_db' en tu MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/wheretosmoke_db?useSSL=false&serverTimezone=America/Bogota&allowPublicKeyRetrieval=true
spring.datasource.username=root
# Si tu MySQL no tiene contraseña (común en XAMPP), deja esto vacío. Si tiene, ponla aquí.
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==========================================
# 🛠️ HERRAMIENTAS DE DESARROLLO (JPA)   
# ==========================================
# Crea las tablas automáticamente al iniciar
spring.jpa.hibernate.ddl-auto=update 
# Muestra el SQL en consola 
spring.jpa.show-sql=true
# ==========================================
# 🌍 FORMATO
# ==========================================
spring.jackson.time-zone=America/Bogota
